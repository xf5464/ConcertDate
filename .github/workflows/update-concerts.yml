name: Update concert calendar

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-concerts.yml"
      - "scripts/scrape.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-concerts
  cancel-in-progress: false

jobs:
  scrape:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update Hangzhou Theatre source
        run: python scripts/fix_hangzhou_source.py

      - name: Scrape concert data
        run: python scripts/scrape.py

      - name: Version concert data
        run: python scripts/version_data.py

      - name: Commit updated concert data
        run: |
          if ! git diff --quiet -- data/concerts.json data/version.json scripts/scrape.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/concerts.json data/version.json scripts/scrape.py
            git commit -m "chore: update concert data"
            git push
          else
            echo "No repository changes."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload current site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy current site
        id: deployment
        uses: actions/deploy-pages@v4
