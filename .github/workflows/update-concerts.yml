name: Update concert calendar

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-concerts.yml"
      - "scripts/scrape.py"
      - "scripts/fix_performance_dates.py"
      - "scripts/upgrade_official_sources.py"
      - "scripts/fix_zjso_official_dates.py"
      - "scripts/add_performance_metadata.py"
      - "scripts/build_pwa_icon_v4.py"
      - "assets-src/piratecat-v4.jpg.b64"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-concerts
  cancel-in-progress: false

jobs:
  scrape:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build PWA icon v1.3.2
        run: |
          if [ -f assets-src/piratecat-v4.jpg.b64 ]; then
            python scripts/build_pwa_icon_v4.py
          else
            echo "PWA icon already built."
          fi

      - name: Update Hangzhou Theatre source
        run: python scripts/fix_hangzhou_source.py

      - name: Fix performance date inference
        run: python scripts/fix_performance_dates.py

      - name: Enable official source priority
        run: python scripts/upgrade_official_sources.py

      - name: Fix ZJSO official date parser
        run: python scripts/fix_zjso_official_dates.py

      - name: Add performance time and duration
        run: python scripts/add_performance_metadata.py

      - name: Scrape concert data
        run: python scripts/scrape.py

      - name: Version concert data
        run: python scripts/version_data.py

      - name: Commit generated files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: build PWA icon v1.3.2 and update concert data"
            git push
          else
            echo "No repository changes."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload current site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy current site
        id: deployment
        uses: actions/deploy-pages@v4
