name: Update concert calendar

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-concerts.yml"

permissions:
  contents: write

concurrency:
  group: update-concerts
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assemble PWA icon source
        run: python scripts/assemble_icon.py

      - name: Prepare hashed PWA assets
        run: python scripts/prepare_pwa.py

      - name: Update Hangzhou Theatre source
        run: python scripts/fix_hangzhou_source.py

      - name: Scrape concert data
        run: python scripts/scrape.py

      - name: Commit generated files and concert data
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: build PWA assets and update concert data"
          git push
