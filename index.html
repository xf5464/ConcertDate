<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="按城市、剧院、月份和星期筛选音乐会日期" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ConcertDate" />
  <title>ConcertDate</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="192x192" href="./assets/apple-touch-icon-ba816ddb.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192-ba816ddb.png" />
  <link rel="stylesheet" href="./assets/styles-91563071.css" />
  <link rel="stylesheet" href="./assets/calendar-interactions-f3a7c2d1.css" />
  <link rel="stylesheet" href="./assets/multi-filter-9c1d2e77.css" />
  <link rel="stylesheet" href="./assets/theater-colors-v1.2.0.css" />
  <link rel="stylesheet" href="./assets/theater-legend-v1.2.1.css" />
  <link rel="stylesheet" href="./assets/concert-list-v1.2.2.css" />
  <link rel="stylesheet" href="./assets/quick-top-b13e7a44.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="topbar-copy">
        <h1>ConcertDate</h1>
        <p>查看不同城市与剧院的音乐会日期 · App v1.2.4</p>
      </div>
      <button id="concertListButton" class="concert-list-button" type="button">音乐会列表</button>
    </div>
  </header>

  <main class="layout">
    <aside class="filters" aria-label="筛选条件">
      <div class="filter-field"><label for="citySelect">城市</label><select id="citySelect"></select></div>
      <div class="filter-field"><label for="theaterSelect">剧院</label><select id="theaterSelect"></select></div>
      <div class="filter-field"><label for="yearSelect">年份</label><select id="yearSelect"></select></div>
      <div class="filter-field"><label for="monthSelect">月份</label><select id="monthSelect"></select></div>
      <div class="filter-field">
        <label>星期</label>
        <div id="weekdayGroup" class="weekday-group" role="group" aria-label="星期筛选"></div>
      </div>
      <div class="legend"><span><i class="dot concert-dot"></i>圆点颜色对应剧院</span></div>
    </aside>

    <section class="calendar-panel">
      <div class="calendar-toolbar">
        <div><strong id="summaryTitle">音乐会日历</strong><span id="summaryText"></span></div>
        <button id="todayButton" type="button">回到当前月</button>
      </div>
      <div id="calendarScroller" class="calendar-scroller" tabindex="0" aria-label="连续月份日历"></div>
      <div id="emptyState" class="empty-state" hidden>当前筛选条件下没有音乐会。</div>
    </section>
  </main>

  <script src="./assets/data-version-loader-9b3e6f21.js" defer></script>
  <script src="./assets/app-v1.2.0.js" defer></script>
  <script src="./assets/theater-legend-v1.2.1.js" defer></script>
  <script src="./assets/calendar-interactions-8c2fd1b4.js" defer></script>
  <script src="./assets/concert-list-v1.2.4.js" defer></script>
  <script src="./assets/quick-top-91d4b2a6.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }
  </script>
</body>
</html>
